<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["thumper","sprocket","mollusk","whirligig","voltaic","cinder","frostbite","boomba"],"default":"thumper"},"tint":{"editor":"color","default":"#F45B55","options":["#F45B55","#4C9AFF","#FFD166"]},"paint":{"editor":"color","default":""},"size":{"editor":"int","default":240,"min":24,"max":600},"flip":{"editor":"boolean","default":false},"aim":{"editor":"range","default":30,"min":0,"max":90,"unit":"°"},"pose":{"editor":"enum","options":["idle","victory","wreck"],"default":"idle"},"$preview":{"width":240,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { thumper: '#F28C38', sprocket: '#5ACB91', mollusk: '#B07CF2', whirligig: '#4CC3D9', voltaic: '#FFD166', cinder: '#FF6B3D', frostbite: '#9FE3FF', boomba: '#FF7EB6' };
    const N = { thumper: 'Thumper', sprocket: 'Sprocket', mollusk: 'Mollusk', whirligig: 'Whirligig', voltaic: 'Voltaic', cinder: 'Cinder', frostbite: 'Frostbite', boomba: 'Boomba' };
    const k = P[this.props.kind] ? this.props.kind : 'thumper';
    const size = Number(this.props.size ?? 240) || 240;
    const pose = this.props.pose ?? 'idle';
    const aim = Number(this.props.aim ?? 30);
    const rot = -(pose === 'victory' ? 62 : pose === 'wreck' ? -18 : aim);
    return {
      label: N[k] + ' battle machine',
      isThumper: k === 'thumper', isSprocket: k === 'sprocket', isMollusk: k === 'mollusk', isWhirligig: k === 'whirligig',
      isVoltaic: k === 'voltaic', isCinder: k === 'cinder', isFrostbite: k === 'frostbite', isBoomba: k === 'boomba',
      w: size, h: Math.round(size / 1.2),
      body: this.props.paint || P[k], tint: this.props.tint || '#F45B55', rot,
      flipT: this.props.flip ? 'translate(120 0) scale(-1 1)' : 'translate(0 0)',
      victory: pose === 'victory', wreck: pose === 'wreck',
      filt: pose === 'wreck' ? 'grayscale(.85) brightness(.65)' : 'none',
      tilt: pose === 'wreck' ? 'rotate(9deg) translateY(6%)' : 'none'
    };
  }
}
</script>
