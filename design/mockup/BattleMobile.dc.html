<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobbers — Battlefield (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Fredoka:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101522}
*{box-sizing:border-box}
.fd{font-family:'Lilita One',Fredoka,system-ui,sans-serif;letter-spacing:.5px;font-weight:400}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{font-family:Fredoka,system-ui,sans-serif;font-weight:600;cursor:pointer;border:3px solid #0B0F1A;border-radius:12px;box-shadow:0 4px 0 #0B0F1A;color:#F5F1E8;background:rgba(35,43,66,.92);display:inline-flex;align-items:center;justify-content:center;gap:4px;touch-action:manipulation;padding:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0B0F1A}
.btn:disabled{filter:grayscale(.8) brightness(.6)}
.btn:focus-visible{outline:3px solid #FFD166}
.wb.on{border-color:#FFD166;background:#2A2A1E}
.hud{background:rgba(16,21,34,.86);border:2px solid #0B0F1A;border-radius:10px}
.field{touch-action:none}
.unit{position:absolute;width:100px;height:84px;transition:left .4s,top .5s cubic-bezier(.5,0,.8,.6)}
.fb{position:absolute;border-radius:50%;animation:fb .7s cubic-bezier(.2,1,.3,1) forwards}
@keyframes fb{0%{transform:scale(.1);opacity:1}100%{transform:scale(1.3);opacity:0}}
.float{position:absolute;transform:translateX(-50%);animation:rise 1.3s cubic-bezier(.2,1.2,.4,1) forwards;-webkit-text-stroke:6px #0B0F1A;paint-order:stroke fill}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
.firec{width:88px;height:88px;border-radius:50%;border:4px solid #0B0F1A;background:#F45B55;box-shadow:0 6px 0 #0B0F1A;color:#101522;font-size:26px;cursor:pointer;touch-action:manipulation}
.firec:active{transform:translateY(4px);box-shadow:0 2px 0 #0B0F1A}
.firec:disabled{filter:grayscale(1) brightness(.6)}
.firec:focus-visible{outline:3px solid #FFD166}
.pad{touch-action:none;cursor:crosshair}
.sheet{animation:sheet .28s cubic-bezier(.2,1.2,.4,1) both}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.arrow{animation:arrow .8s ease-in-out infinite}
@keyframes arrow{50%{transform:translateY(-8px)}}
</style>
</helmet>
<div style="width:844px;height:390px;position:relative;overflow:hidden;background:#101522;font-family:Fredoka,system-ui,sans-serif;color:#F5F1E8">
  <div class="field" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" style="position:absolute;inset:0;overflow:hidden;background:{{sky}}">
    <div data-lb="{{lbWorld}}" style="position:absolute;left:0;top:0;width:{{W}}px;height:{{H}}px;transform-origin:0 0;transform:{{worldT}};transition:{{camTr}}">
      <dc-import name="Scene" map="{{mapId}}" w="{{W}}" h="{{H}}" craters="{{craters}}" hint-size="100%,100%"></dc-import>
      <sc-if value="{{showPrev}}" hint-placeholder-val="{{ true }}">
        <svg aria-hidden="true" width="{{W}}" height="{{H}}" viewBox="{{vb}}" style="position:absolute;left:0;top:0"><polyline points="{{prevPts}}" fill="none" stroke="#0B0F1A" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 20" opacity=".7"></polyline><polyline points="{{prevPts}}" fill="none" stroke="#F5F1E8" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 20"></polyline></svg>
      </sc-if>
      <sc-for list="{{units}}" as="u" hint-placeholder-count="8">
        <div class="unit" style="left:{{u.left}}px;top:{{u.top}}px">
          <sc-if value="{{u.alive}}" hint-placeholder-val="{{ true }}">
            <span style="position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:86px;height:14px;border:3px solid #0B0F1A;border-radius:7px;background:#0E1320;overflow:hidden;display:block"><span style="display:block;height:100%;width:{{u.pct}}%;background:{{u.col}};transition:width .6s"></span></span>
            <sc-if value="{{u.isYou}}" hint-placeholder-val="{{ false }}"><svg class="arrow" aria-hidden="true" width="34" height="26" viewBox="0 0 26 20" style="position:absolute;left:33px;top:-54px"><path d="M2 2 H24 L13 18 Z" fill="#FFD166" stroke="#0B0F1A" stroke-width="3"></path></svg></sc-if>
          </sc-if>
          <dc-import name="Machine" kind="{{u.kind}}" tint="{{u.tint}}" size="{{ 100 }}" flip="{{u.flip}}" aim="{{u.aim}}" pose="{{u.pose}}" hint-size="100px,83px"></dc-import>
        </div>
      </sc-for>
      <sc-if value="{{flying}}" hint-placeholder-val="{{ false }}">
        <div data-lb="{{lbShell}}" style="position:absolute;left:0;top:0;transform:{{fly.t0}}"><svg aria-hidden="true" width="30" height="16" viewBox="0 0 30 16"><path d="M3 3 H19 Q28 8 19 13 H3 Z" fill="{{fly.col}}" stroke="#0B0F1A" stroke-width="2.5"></path></svg></div>
      </sc-if>
      <sc-if value="{{hasBoom}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:{{boom.x}}px;top:{{boom.y}}px">
          <div class="fb" style="left:{{boom.o}}px;top:{{boom.o}}px;width:{{boom.s}}px;height:{{boom.s}}px;background:{{boom.col}};border:5px solid #0B0F1A"></div>
          <div class="fb" style="left:{{boom.io}}px;top:{{boom.io}}px;width:{{boom.is}}px;height:{{boom.is}}px;background:#FFF6D6;animation-duration:.45s"></div>
        </div>
      </sc-if>
      <sc-for list="{{floaters}}" as="f" hint-placeholder-count="0"><div class="float fd" style="left:{{f.x}}px;top:{{f.y}}px;font-size:60px;color:{{f.col}}">{{f.t}}</div></sc-for>
    </div>
  </div>

  <div style="position:absolute;left:8px;top:8px;width:828px;display:flex;align-items:center;gap:8px">
    <button class="btn" aria-label="Pause" style="width:44px;height:44px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#F5F1E8"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg></button>
    <div class="hud" style="display:flex;gap:3px;padding:3px" aria-label="Team Red">
      <sc-for list="{{red}}" as="m" hint-placeholder-count="4"><span style="width:30px;height:36px;border-radius:6px;background:#3A2230;border:2px solid {{m.bd}};display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 0;opacity:{{m.op}}"><dc-import name="Machine" kind="{{m.kind}}" tint="#F45B55" size="{{ 26 }}" hint-size="26px,22px"></dc-import><span style="width:22px;height:4px;background:#0E1320;border-radius:2px;overflow:hidden;display:block"><span style="display:block;height:100%;width:{{m.pct}}%;background:#F45B55"></span></span></span></sc-for>
    </div>
    <div style="flex:1;display:flex;justify-content:center">
      <div class="hud" style="display:flex;align-items:center;gap:8px;padding:4px 12px">
        <span class="fd" style="font-size:18px;color:#FFD166">YOUR TURN</span>
        <span class="mono" style="font-size:18px;font-weight:700;background:#0E1320;border-radius:6px;padding:0 6px;color:#5ACB91">{{timer}}</span>
        <span style="display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700"><svg aria-hidden="true" width="22" height="12" viewBox="0 0 70 34" style="transform:scaleX({{windDir}})"><path d="M4 12 H46 V4 L66 17 L46 30 V22 H4 Z" fill="#FFD166" stroke="#0B0F1A" stroke-width="4"></path></svg><span class="mono">{{windAbs}}</span></span>
      </div>
    </div>
    <div class="hud" style="display:flex;gap:3px;padding:3px" aria-label="Team Blue">
      <sc-for list="{{blue}}" as="m" hint-placeholder-count="4"><span style="width:30px;height:36px;border-radius:6px;background:#1E2D4E;border:2px solid #0B0F1A;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 0;opacity:{{m.op}}"><dc-import name="Machine" kind="{{m.kind}}" tint="#4C9AFF" size="{{ 26 }}" flip="{{ true }}" hint-size="26px,22px"></dc-import><span style="width:22px;height:4px;background:#0E1320;border-radius:2px;overflow:hidden;display:block"><span style="display:block;height:100%;width:{{m.pct}}%;background:#4C9AFF"></span></span></span></sc-for>
    </div>
  </div>

  <div style="position:absolute;left:10px;top:318px;display:flex;gap:8px;align-items:flex-end">
    <button class="btn" aria-label="Move left" onClick="{{moveL}}" disabled="{{busy}}" style="width:56px;height:60px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <button class="btn" aria-label="Move right" onClick="{{moveR}}" disabled="{{busy}}" style="width:56px;height:60px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
    <span style="width:6px"></span>
    <sc-for list="{{quick}}" as="w" hint-placeholder-count="3">
      <button class="{{w.cls}}" onClick="{{w.pick}}" aria-label="{{w.n}}" aria-pressed="{{w.on}}" style="width:64px;height:64px;flex-direction:column;position:relative"><dc-import name="WeaponIcon" cat="{{w.icon}}" col="{{w.col}}" size="{{ 38 }}" hint-size="38px,38px"></dc-import><span class="mono" style="position:absolute;right:3px;bottom:1px;font-size:11px;color:#FFD166">{{w.ammo}}</span></button>
    </sc-for>
    <button class="btn" onClick="{{openSheet}}" aria-label="All weapons" style="width:64px;height:64px;flex-direction:column;font-size:11px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="#F5F1E8"><circle cx="5" cy="12" r="2.5"></circle><circle cx="12" cy="12" r="2.5"></circle><circle cx="19" cy="12" r="2.5"></circle></svg>More</button>
    <button class="btn" onClick="{{focus}}" aria-label="Focus camera on your machine" style="width:48px;height:48px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2" fill="currentColor"></circle><path d="M12 1v4M12 19v4M1 12h4M19 12h4"></path></svg></button>
  </div>

  <div style="position:absolute;left:568px;top:212px;width:140px;display:flex;flex-direction:column;align-items:center;gap:4px">
    <span class="hud mono" style="font-size:14px;font-weight:700;padding:1px 8px">{{angle}}° · <span style="color:#FFD166">{{power}}</span></span>
    <div class="pad" onPointerDown="{{padDown}}" onPointerMove="{{padMove}}" onPointerUp="{{padUp}}" onPointerCancel="{{padUp}}" role="slider" aria-label="Aim pad: drag to set angle and power" aria-valuetext="{{padText}}" tabIndex="0" style="width:132px;height:132px;border-radius:50%;background:rgba(16,21,34,.7);border:3px solid #0B0F1A;position:relative">
      <svg aria-hidden="true" width="126" height="126" viewBox="0 0 126 126" style="position:absolute;left:0;top:0">
        <circle cx="63" cy="63" r="56" fill="none" stroke="#F5F1E8" stroke-width="2" stroke-dasharray="4 6" opacity=".5"></circle>
        <circle cx="63" cy="63" r="28" fill="none" stroke="#F5F1E8" stroke-width="1.5" opacity=".3"></circle>
        <line x1="63" y1="63" x2="{{knob.x}}" y2="{{knob.y}}" stroke="#FFD166" stroke-width="4" stroke-linecap="round"></line>
        <circle cx="63" cy="63" r="5" fill="#F5F1E8"></circle>
        <circle cx="{{knob.x}}" cy="{{knob.y}}" r="15" fill="#FFD166" stroke="#0B0F1A" stroke-width="3"></circle>
      </svg>
    </div>
  </div>
  <button class="firec fd" onClick="{{fire}}" disabled="{{busy}}" style="position:absolute;left:730px;top:280px">FIRE</button>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(8,11,20,.6);display:flex;align-items:flex-end" onClick="{{closeSheet}}">
      <div class="sheet" role="dialog" aria-label="Weapons" onClick="{{stop}}" style="width:100%;background:#151B2B;border-top:4px solid #0B0F1A;border-radius:16px 16px 0 0;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="fd" style="font-size:22px">WEAPONS</span><button class="btn" onClick="{{closeSheet}}" aria-label="Close" style="width:44px;height:44px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"></path></svg></button></div>
        <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
          <sc-for list="{{all}}" as="w" hint-placeholder-count="6">
            <button class="{{w.cls}}" onClick="{{w.pick}}" style="height:86px;flex-direction:column;gap:2px"><dc-import name="WeaponIcon" cat="{{w.icon}}" col="{{w.col}}" size="{{ 40 }}" hint-size="40px,40px"></dc-import><span style="font-size:12px">{{w.n}}</span><span class="mono" style="font-size:11px;color:#FFD166">{{w.ammo}}</span></button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
const MAPS = {
  hollow: { n: 'Glowcap Hollow', W: 2600, H: 1000, base: 700, waves: [[34, 130, 2.4], [20, 57, 0.2], [9, 24, 1]], peaks: [[900, 120, 140], [1700, 140, 150]], chasms: [], thick: 0 }
};
const MAP_ID = 'hollow', SKY = '#0E0820';
const SPAWN = { red: [220, 450, 680, 1000], blue: [2380, 2150, 1920, 1600] };
const topY = (m, x) => { let y = m.base; for (const [a, p, ph] of m.waves) y += a * Math.sin(x / p + ph); for (const [px, h, w] of m.peaks) y -= h * Math.exp(-Math.pow((x - px) / w, 2)); return y; };
const CL = (v, a, b) => Math.max(a, Math.min(b, v));
const VW = 844, VH = 390, Z = 0.55;
const W = [
  { id: 'rocket', n: 'Rocket', icon: 'Explosive', col: '#F5F1E8', dmg: 150, rad: 40, ammo: -1 },
  { id: 'ice', n: 'Ice Bomb', icon: 'Ice', col: '#9FE3FF', dmg: 100, rad: 62, ammo: 2 },
  { id: 'lightning', n: 'Lightning', icon: 'Electric', col: '#FFE45E', dmg: 170, rad: 30, ammo: 2 },
  { id: 'heavy', n: 'Heavy', icon: 'Explosive', col: '#FFB547', dmg: 260, rad: 58, ammo: 3 },
  { id: 'fire', n: 'Fire Bomb', icon: 'Fire', col: '#FF6B3D', dmg: 110, rad: 46, ammo: 2 },
  { id: 'gravity', n: 'Gravity', icon: 'Gravity', col: '#B07CF2', dmg: 140, rad: 50, ammo: 1 }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = []; this.anims = []; this.seq = 1; this.uid = Math.random().toString(36).slice(2, 8);
    const m = MAPS[MAP_ID];
    const U = (id, team, kind, slot, hp, max) => { const x = SPAWN[team][slot]; return { id, team, kind, x, y: topY(m, x), hp, max, face: team === 'red' ? 1 : -1 }; };
    const ammo = {}; W.forEach((w) => { ammo[w.id] = w.ammo; });
    const units = [U('r0', 'red', 'thumper', 0, 780, 1000), U('r1', 'red', 'voltaic', 1, 540, 700), U('r2', 'red', 'sprocket', 2, 0, 600), U('r3', 'red', 'cinder', 3, 470, 800), U('b0', 'blue', 'frostbite', 0, 620, 800), U('b1', 'blue', 'mollusk', 1, 690, 1100), U('b2', 'blue', 'whirligig', 2, 140, 700), U('b3', 'blue', 'boomba', 3, 480, 700)];
    this.state = { units, angle: 52, power: 64, wind: 5, weapon: 'rocket', ammo, timer: 30, craters: [{ x: 560, y: Math.round(topY(m, 560) + 6), r: 26 }], fly: null, boom: null, floaters: [], busy: false, sheet: false, drag: false, cam: this.camFor(units[0].x + 380, units[0].y - 120), camAnim: false };
  }
  get m() { return MAPS[MAP_ID]; }
  later(f, ms) { this.timers.push(setTimeout(f, ms)); }
  componentDidMount() { this.iv = setInterval(() => { if (!this.state.busy) this.setState({ timer: this.state.timer > 1 ? this.state.timer - 1 : 30 }); }, 1000); }
  componentWillUnmount() { this.timers.forEach(clearTimeout); clearInterval(this.iv); this.anims.forEach((a) => a.cancel()); }
  camFor(x, y) { const m = this.m; return { x: CL(x - VW / (2 * Z), 0, m.W - VW / Z), y: CL(y - VH / (2 * Z) + 60, 0, Math.max(0, m.H - VH / Z)) }; }
  tf(c) { return 'translate(' + (-c.x * Z).toFixed(1) + 'px, ' + (-c.y * Z).toFixed(1) + 'px) scale(' + Z + ')'; }
  solid(cr, x, y) { const m = this.m; if (x < 0 || x > m.W || y < topY(m, x) || y > m.H + 20) return false; for (const c of cr) if ((x - c.x) ** 2 + (y - c.y) ** 2 < c.r * c.r) return false; return true; }
  surf(cr, x) { const m = this.m; if (x < 0 || x > m.W) return null; let y = topY(m, x); for (let k = 0; k < 14; k++) { let mv = false; for (const c of cr) { const dx = x - c.x; if (Math.abs(dx) < c.r) { const h = Math.sqrt(c.r * c.r - dx * dx); if (y >= c.y - h && y < c.y + h) { y = c.y + h + 0.5; mv = true; } } } if (!mv) break; } return y > m.H ? null : y; }
  traj(u, ang, pow) {
    const s = this.state, m = this.m; const a = ang * Math.PI / 180, v = pow / 100 * 26;
    let x = u.x + u.face * 28, y = u.y - 52, vx = Math.cos(a) * v * u.face, vy = -Math.sin(a) * v; const pts = [[x, y]];
    for (let i = 0; i < 1200; i++) {
      vx += s.wind * 0.0035; vy += 0.26;
      const st = Math.max(1, Math.ceil(Math.hypot(vx, vy) / 5));
      for (let k = 0; k < st; k++) {
        x += vx / st; y += vy / st;
        if (x < -100 || x > m.W + 100 || y > m.H + 60) { pts.push([x, y]); return { pts, hit: null }; }
        for (const e of s.units) { if (e.hp <= 0 || (e.id === u.id && i < 14)) continue; const cy = e.y - 36 - (e.kind === 'whirligig' ? 24 : 0); if ((x - e.x) ** 2 + (y - cy) ** 2 < 784) { pts.push([x, y]); return { pts, hit: { x, y } }; } }
        if (this.solid(s.craters, x, y)) { pts.push([x, y]); return { pts, hit: { x, y } }; }
      }
      pts.push([x, y]);
    }
    return { pts, hit: null };
  }
  aimFrom(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = (r.top + r.height / 2) - e.clientY;
    const rad = r.width / 2 * 0.86;
    const ang = CL(Math.round(Math.atan2(Math.max(0, dy), Math.abs(dx)) * 180 / Math.PI), 0, 90);
    const pow = CL(Math.round(Math.hypot(dx, Math.max(0, dy)) / rad * 100), 5, 100);
    const units = this.state.units.slice(); units[0] = { ...units[0], face: dx < 0 ? -1 : 1 };
    this.setState({ angle: ang, power: pow, units });
  }
  fire() {
    const s = this.state; if (s.busy) return; const you = s.units[0]; const w = W.find((x) => x.id === s.weapon);
    const tr = this.traj(you, s.angle, s.power); const step = Math.max(1, Math.floor(tr.pts.length / 110));
    const samples = tr.pts.filter((p, i) => i % step === 0 || i === tr.pts.length - 1);
    const dur = Math.round(CL(tr.pts.length * 16.7, 600, 5000));
    const ammo = { ...s.ammo }; if (ammo[w.id] > 0) ammo[w.id]--;
    this.setState({ busy: true, camAnim: false, sheet: false, fly: { col: w.col, t0: 'translate(' + (samples[0][0] - 15) + 'px,' + (samples[0][1] - 8) + 'px)' }, ammo });
    this.later(() => {
      if (typeof document === 'undefined') return;
      const q = (k) => document.querySelector('[data-lb="' + k + '-' + this.uid + '"]');
      const n = samples.length, offs = samples.map((_, i) => i / (n - 1)), opt = { duration: dur, easing: 'linear', fill: 'forwards' };
      const shell = q('shell'), world = q('world');
      if (shell && shell.animate) this.anims.push(shell.animate(samples.map((p, i) => ({ transform: 'translate(' + (p[0] - 15) + 'px,' + (p[1] - 8) + 'px)', offset: offs[i] })), opt));
      let c = { ...this.state.cam }; const fr = [];
      samples.forEach((p, i) => { const t = this.camFor(p[0], p[1]); c = i === n - 1 ? t : { x: c.x + (t.x - c.x) * 0.22, y: c.y + (t.y - c.y) * 0.22 }; fr.push({ transform: this.tf(c), offset: offs[i] }); });
      if (world && world.animate) this.anims.push(world.animate(fr, opt));
      this.endCam = c;
    }, 30);
    this.later(() => {
      if (this.endCam) this.setState({ cam: this.endCam });
      const anims = this.anims; this.anims = []; requestAnimationFrame(() => requestAnimationFrame(() => anims.forEach((a) => a.cancel())));
      if (!tr.hit) { this.setState({ fly: null }); this.later(() => this.endShot(), 700); return; }
      const st = this.state; const { x: hx, y: hy } = tr.hit; const fl = [];
      const craters = st.craters.concat({ x: Math.round(hx), y: Math.round(hy), r: Math.round(w.rad * 0.62) }).slice(-50);
      const units = st.units.map((u) => {
        if (u.hp <= 0) return u; const d = Math.hypot(u.x - hx, u.y - 36 - hy); const reach = w.rad + 36; const gy = this.surf(craters, u.x);
        let dm = 0; if (d < reach) dm = Math.round(w.dmg * (1 - 0.65 * d / reach) * (u.team === 'red' ? 0.5 : 1));
        if (dm) fl.push({ id: ++this.seq, x: u.x, y: u.y - 140, t: '-' + dm, col: '#F5F1E8' });
        return { ...u, hp: Math.max(0, u.hp - dm), y: gy === null ? u.y : gy };
      });
      if (!fl.length) fl.push({ id: ++this.seq, x: hx, y: hy - 80, t: 'MISS', col: '#C9D8F0' });
      this.setState({ fly: null, units, floaters: fl, boom: { x: hx, y: hy, r: w.rad, col: w.col }, craters });
      this.later(() => this.setState({ boom: null }), 800);
      this.later(() => this.endShot(), 1500);
    }, dur + 30);
  }
  endShot() { const s = this.state; this.setState({ floaters: [], busy: false, timer: 30, wind: Math.round((Math.random() * 2 - 1) * 10), cam: this.camFor(s.units[0].x + 380, s.units[0].y - 120), camAnim: true }); }
  move(dir) { const s = this.state; if (s.busy) return; const units = s.units.slice(); const u = units[0]; const nx = CL(u.x + dir * 14, 40, 1500); const gy = this.surf(s.craters, nx); const ok = gy !== null && gy > u.y - 16; units[0] = { ...u, x: ok ? nx : u.x, y: ok ? gy : u.y, face: dir }; this.setState({ units }); }
  renderVals() {
    const s = this.state, m = this.m; const you = s.units[0];
    let prevPts = '';
    if (!s.busy) prevPts = this.traj(you, s.angle, s.power).pts.slice(0, 70).filter((p, i) => i % 2 === 0).map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const a = s.angle * Math.PI / 180, R = 48 * s.power / 100;
    const mk = (w) => ({ ...w, on: s.weapon === w.id, cls: 'btn wb' + (s.weapon === w.id ? ' on' : ''), ammo: s.ammo[w.id] < 0 ? '∞' : '×' + s.ammo[w.id], pick: () => { if (s.ammo[w.id] !== 0) this.setState({ weapon: w.id, sheet: false }); } });
    const b = s.boom;
    const mini = (t) => s.units.filter((u) => u.team === t).map((u) => ({ kind: u.kind, pct: Math.round(u.hp / u.max * 100), op: u.hp > 0 ? 1 : 0.45, bd: u.id === 'r0' ? '#FFD166' : '#0B0F1A' }));
    return {
      mapId: MAP_ID, W: m.W, H: m.H, vb: '0 0 ' + m.W + ' ' + m.H, sky: SKY, lbWorld: 'world-' + this.uid, lbShell: 'shell-' + this.uid,
      worldT: this.tf(s.cam), camTr: s.camAnim ? 'transform .9s cubic-bezier(.3,.8,.3,1)' : 'none',
      craters: s.craters, showPrev: !s.busy, prevPts,
      units: s.units.map((u) => ({ ...u, alive: u.hp > 0, isYou: u.id === 'r0' && !s.busy, left: u.x - 50, top: (u.y - 79 - (u.kind === 'whirligig' ? 24 : 0)).toFixed(1), flip: u.face < 0, aim: u.id === 'r0' ? s.angle : 22, pose: u.hp > 0 ? 'idle' : 'wreck', tint: u.team === 'red' ? '#F45B55' : '#4C9AFF', pct: Math.round(u.hp / u.max * 100), col: u.team === 'red' ? '#5ACB91' : '#4C9AFF' })),
      flying: !!s.fly, fly: s.fly || { col: '#fff', t0: 'none' },
      hasBoom: !!b, boom: b ? { x: b.x, y: b.y, col: b.col, s: b.r * 2, o: -b.r, is: b.r * 1.1, io: -b.r * 0.55 } : { x: 0, y: 0 },
      floaters: s.floaters, red: mini('red'), blue: mini('blue'),
      timer: s.timer, windDir: s.wind < 0 ? -1 : 1, windAbs: Math.abs(s.wind),
      quick: W.slice(0, 3).map(mk), all: W.map(mk), sheet: s.sheet,
      openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false }), stop: (e) => e.stopPropagation(),
      busy: s.busy, moveL: () => this.move(-1), moveR: () => this.move(1),
      focus: () => { if (!s.busy) this.setState({ cam: this.camFor(you.x + 380, you.y - 120), camAnim: true }); },
      onDown: (e) => { if (s.busy) return; const r = e.currentTarget.getBoundingClientRect(); this.drag = { sx: e.clientX, sy: e.clientY, cx: s.cam.x, cy: s.cam.y, k: r.width / VW }; },
      onMove: (e) => { const d = this.drag; if (!d) return; const dx = (e.clientX - d.sx) / d.k / Z, dy = (e.clientY - d.sy) / d.k / Z; if (Math.abs(dx) + Math.abs(dy) < 6) return; this.setState({ cam: { x: CL(d.cx - dx, 0, m.W - VW / Z), y: CL(d.cy - dy, 0, Math.max(0, m.H - VH / Z)) }, camAnim: false }); },
      onUp: () => { this.drag = null; },
      angle: s.angle, power: s.power, padText: s.angle + ' degrees, power ' + s.power,
      knob: { x: (63 + you.face * Math.cos(a) * R).toFixed(1), y: (63 - Math.sin(a) * R).toFixed(1) },
      padDown: (e) => { if (s.busy) return; e.stopPropagation(); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} this.setState({ drag: true }); this.aimFrom(e); },
      padMove: (e) => { if (this.state.drag) { e.stopPropagation(); this.aimFrom(e); } },
      padUp: () => this.setState({ drag: false }),
      fire: () => this.fire()
    };
  }
}
