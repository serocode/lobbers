<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battlefield scene</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width:{{w}}px;height:{{h}}px;position:relative;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;color:#F5F1E8;background:{{rootBg}}">
<svg width="{{w}}" height="{{h}}" viewBox="{{vb}}" preserveAspectRatio="xMidYMid slice" style="display:block;overflow:visible" role="img" aria-label="{{label}}">
  <defs>
    <linearGradient id="sky-{{map}}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{P.skyTop}}"></stop><stop offset=".55" stop-color="{{P.skyMid}}"></stop><stop offset="1" stop-color="{{P.skyBot}}"></stop>
    </linearGradient>
    <clipPath id="tc-{{map}}"><path d="{{terrainD}}"></path></clipPath>
    <mask id="cm-{{map}}" maskUnits="userSpaceOnUse" x="-50" y="-50" width="{{maskW}}" height="{{maskH}}">
      <rect x="-50" y="-50" width="{{maskW}}" height="{{maskH}}" fill="#fff"></rect>
      <sc-for list="{{craters}}" as="c" hint-placeholder-count="2"><circle cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" fill="#000"></circle></sc-for>
    </mask>
  </defs>

  <sc-if value="{{showBack}}" hint-placeholder-val="{{ true }}">
  <g>
    <rect x="0" y="0" width="{{W}}" height="{{H}}" fill="url(#sky-{{map}})"></rect>
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="10">
      <circle cx="{{s.x}}" cy="{{s.y}}" r="{{s.r}}" fill="#F5F1E8"><animate attributeName="opacity" values=".2;1;.2" dur="{{s.dur}}" repeatCount="indefinite"></animate></circle>
    </sc-for>

    <sc-if value="{{isCobalt}}" hint-placeholder-val="{{ true }}">
      <g transform="{{celT}}">
        <circle cx="-880" cy="-40" r="20" fill="#F5F1E8" opacity=".75"></circle>
        <ellipse cx="0" cy="0" rx="128" ry="24" fill="none" stroke="#F5D7A1" stroke-width="9" opacity=".7" transform="rotate(-16)"></ellipse>
        <circle cx="0" cy="0" r="74" fill="#F2A65A" stroke="#151B2B" stroke-width="4"></circle>
        <path d="M-68 -22 Q0 -38 68 -18 M-72 10 Q0 -4 72 16" fill="none" stroke="#D9783A" stroke-width="10" opacity=".7"></path>
        <path d="M-40 -54 Q-20 -66 8 -68" fill="none" stroke="#FFE2B8" stroke-width="6" stroke-linecap="round" opacity=".7"></path>
        <path d="M-124 36 A128 24 -16 0 0 122 -38" fill="none" stroke="#F5D7A1" stroke-width="9" opacity=".95"></path>
      </g>
    </sc-if>
    <sc-if value="{{isEmber}}" hint-placeholder-val="{{ false }}">
      <g>
        <g transform="{{celT}}"><circle cx="0" cy="0" r="190" fill="#FFB45E" opacity=".16"></circle><circle cx="0" cy="0" r="135" fill="#FFB45E" opacity=".9"></circle><circle cx="0" cy="0" r="135" fill="none" stroke="#FFE29A" stroke-width="6" opacity=".6"></circle></g>
        <sc-for list="{{volcanoes}}" as="v" hint-placeholder-count="2">
          <g transform="{{v.tf}}"><path d="M-130 150 L-40 0 L-10 14 L20 -6 L40 0 L130 150 Z" fill="#3A1A30"></path><path d="M-14 8 Q5 -20 26 6" fill="none" stroke="#FF8A3D" stroke-width="7"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"></animate></path><path d="M6 -4 Q2 40 -8 90" fill="none" stroke="#FF6B3D" stroke-width="5" opacity=".7"></path></g>
        </sc-for>
      </g>
    </sc-if>
    <sc-if value="{{isGlacier}}" hint-placeholder-val="{{ false }}">
      <g>
        <path d="{{aur1a}}" fill="none" stroke="#5ACB91" stroke-width="56" opacity=".22" stroke-linecap="round"><animate attributeName="d" values="{{aur1}}" dur="16s" repeatCount="indefinite"></animate></path>
        <path d="{{aur2a}}" fill="none" stroke="#8FE3FF" stroke-width="34" opacity=".18" stroke-linecap="round"><animate attributeName="d" values="{{aur2}}" dur="12s" repeatCount="indefinite"></animate></path>
        <g transform="{{celT}}"><circle cx="0" cy="0" r="52" fill="#EAF2FF" stroke="#151B2B" stroke-width="4"></circle><circle cx="-16" cy="-12" r="10" fill="#C9D8F0"></circle><circle cx="16" cy="14" r="13" fill="#C9D8F0"></circle></g>
      </g>
    </sc-if>
    <sc-if value="{{isDunes}}" hint-placeholder-val="{{ false }}">
      <g>
        <g transform="{{celT}}"><circle cx="0" cy="0" r="210" fill="#FFF3C4" opacity=".18"></circle><circle cx="0" cy="0" r="120" fill="#FFF3C4" opacity=".95"></circle></g>
        <sc-for list="{{pyramids}}" as="p" hint-placeholder-count="2"><g transform="{{p.tf}}"><path d="M-150 0 L0 -150 L150 0 Z" fill="#C98458"></path><path d="M0 -150 L150 0 L40 0 Z" fill="#A86A38" opacity=".7"></path></g></sc-for>
      </g>
    </sc-if>
    <sc-if value="{{isSky}}" hint-placeholder-val="{{ false }}">
      <g transform="{{celT}}">
        <circle cx="0" cy="0" r="140" fill="#FFFFFF" opacity=".25"></circle>
        <circle cx="0" cy="0" r="62" fill="#FFF6C8" stroke="#FFD166" stroke-width="6"></circle>
        <g stroke="#FFF6C8" stroke-width="8" stroke-linecap="round" opacity=".7"><path d="M0 -96 V-78 M0 78 V96 M-96 0 H-78 M78 0 H96 M-68 -68 L-55 -55 M55 55 L68 68 M-68 68 L-55 55 M55 -55 L68 -68"></path><animateTransform attributeName="transform" type="rotate" values="0;45" dur="8s" repeatCount="indefinite"></animateTransform></g>
      </g>
    </sc-if>
    <sc-if value="{{isHollow}}" hint-placeholder-val="{{ false }}">
      <g transform="{{celT}}"><circle cx="0" cy="0" r="150" fill="#B07CF2" opacity=".14"></circle><circle cx="0" cy="0" r="74" fill="#E6D9F2" stroke="#151B2B" stroke-width="4"></circle><circle cx="-22" cy="-16" r="12" fill="#CDBEE6"></circle><circle cx="20" cy="20" r="16" fill="#CDBEE6"></circle></g>
    </sc-if>

    <path d="{{farD}}" fill="{{P.far}}"></path>
    <sc-for list="{{skyIsles}}" as="s" hint-placeholder-count="0"><g transform="{{s.tf}}" opacity=".75"><path d="M-90 0 Q-60 50 0 70 Q60 50 90 0 Q0 -18 -90 0 Z" fill="{{P.far}}"></path><path d="M-92 0 Q0 -22 92 0" fill="none" stroke="#DDEBFF" stroke-width="8" stroke-linecap="round"></path></g></sc-for>
    <sc-for list="{{clouds}}" as="c" hint-placeholder-count="5">
      <g opacity="{{c.op}}">
        <animateTransform attributeName="transform" type="translate" values="{{c.vals}}" dur="{{c.dur}}" begin="{{c.begin}}" repeatCount="indefinite"></animateTransform>
        <path d="M0 30 Q0 10 22 12 Q30 -6 52 2 Q70 -8 86 10 Q108 8 108 30 Z" fill="{{P.cloud}}" transform="{{c.tf}}"></path>
      </g>
    </sc-for>
    <rect x="0" y="{{hazeY}}" width="{{W}}" height="{{hazeH}}" fill="{{P.skyBot}}" opacity=".22"></rect>
    <path d="{{midD}}" fill="{{P.mid}}" opacity="{{midOp}}"></path>
    <sc-for list="{{bgShrooms}}" as="s" hint-placeholder-count="0">
      <g transform="{{s.tf}}"><rect x="-16" y="-260" width="32" height="260" fill="#2E1E52"></rect><path d="M-120 -250 Q0 -360 120 -250 Q0 -226 -120 -250 Z" fill="#3E2470"></path>
        <circle cx="-50" cy="-276" r="9" fill="#A8FFD8" opacity=".7"><animate attributeName="opacity" values=".3;.9;.3" dur="{{s.dur}}" repeatCount="indefinite"></animate></circle><circle cx="30" cy="-296" r="7" fill="#A8FFD8" opacity=".6"></circle><circle cx="70" cy="-266" r="6" fill="#FF7EB6" opacity=".7"></circle></g>
    </sc-for>
    <path d="{{nearD}}" fill="{{P.near}}" opacity="{{nearOp}}"></path>

    <sc-for list="{{islands}}" as="i" hint-placeholder-count="3">
      <g transform="{{i.tf}}">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="{{i.dur}}" repeatCount="indefinite"></animateTransform>
          <rect x="46" y="10" width="16" height="190" fill="{{P.fall}}" opacity=".55"></rect>
          <path d="M50 10 V200 M57 10 V200" stroke="#fff" stroke-width="2" stroke-dasharray="10 14" opacity=".6"><animate attributeName="stroke-dashoffset" values="0;-48" dur=".8s" repeatCount="indefinite"></animate></path>
          <g stroke="#151B2B" stroke-width="4" stroke-linejoin="round">
            <path d="M-80 4 Q-64 50 -24 84 Q-4 108 10 82 Q44 60 80 4 Z" fill="{{P.dirtDark}}"></path>
            <path d="M-82 2 L82 2 L72 18 L-72 18 Z" fill="{{P.dirt}}"></path>
            <path d="M-86 4 Q-82 -10 -60 -8 Q-30 -15 0 -10 Q40 -17 70 -9 Q90 -8 86 6 Z" fill="{{P.grass}}"></path>
          </g>
          <path d="M-40 30 Q-44 54 -36 70 M20 40 Q26 62 18 84 M-10 70 Q-12 90 -4 104" fill="none" stroke="{{P.trunk}}" stroke-width="3" stroke-linecap="round"></path>
          <g transform="translate(-34 -8)" stroke="#151B2B" stroke-width="3">
            <rect x="-4" y="-26" width="8" height="26" fill="{{P.trunk}}"></rect>
            <circle cx="0" cy="-36" r="18" fill="{{P.foliage}}"></circle><circle cx="10" cy="-28" r="12" fill="{{P.foliageDark}}"></circle>
          </g>
        </g>
      </g>
    </sc-for>

    <sc-if value="{{isLava}}" hint-placeholder-val="{{ false }}">
      <g><rect x="0" y="{{hzY}}" width="{{W}}" height="80" fill="#FF6B3D"></rect><rect x="0" y="{{hzY}}" width="{{W}}" height="80" fill="#FFD166" opacity=".4"><animate attributeName="opacity" values=".15;.5;.15" dur="2.4s" repeatCount="indefinite"></animate></rect><path d="{{hzWave}}" fill="none" stroke="#FFE29A" stroke-width="5" opacity=".8"></path></g>
    </sc-if>
    <sc-if value="{{isWater}}" hint-placeholder-val="{{ false }}">
      <g><rect x="0" y="{{hzY}}" width="{{W}}" height="80" fill="#2E6FA8"></rect><path d="{{hzWave}}" fill="none" stroke="#D7F3FF" stroke-width="4" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="5s" repeatCount="indefinite"></animateTransform></path></g>
    </sc-if>
  </g>
  </sc-if>

  <sc-if value="{{showTerrain}}" hint-placeholder-val="{{ true }}">
  <g mask="url(#cm-{{map}})">
    <path d="{{terrainD}}" fill="{{P.dirt}}"></path>
    <g clip-path="url(#tc-{{map}})">
      <path d="{{topD}}" transform="translate(0 70)" fill="none" stroke="{{P.dirtDark}}" stroke-width="30" opacity=".45"></path>
      <path d="{{topD}}" transform="translate(0 150)" fill="none" stroke="{{P.dirtDark}}" stroke-width="44" opacity=".6"></path>
      <sc-if value="{{isFloat}}" hint-placeholder-val="{{ false }}"><path d="{{botD}}" fill="none" stroke="#151B2B" stroke-width="40" opacity=".35"></path></sc-if>
      <sc-for list="{{pebbles}}" as="p" hint-placeholder-count="12"><ellipse cx="{{p.x}}" cy="{{p.y}}" rx="{{p.r}}" ry="{{p.ry}}" fill="{{P.rock}}" stroke="#151B2B" stroke-width="2.5"></ellipse></sc-for>
      <sc-for list="{{craters}}" as="c" hint-placeholder-count="2"><circle cx="{{c.x}}" cy="{{c.y}}" r="{{c.rim}}" fill="#151B2B" opacity=".55"></circle></sc-for>
    </g>
    <sc-if value="{{isFloat}}" hint-placeholder-val="{{ false }}"><path d="{{botD}}" fill="none" stroke="#151B2B" stroke-width="5" stroke-linejoin="round"></path></sc-if>
    <sc-for list="{{roots}}" as="r" hint-placeholder-count="0"><path d="{{r.d}}" fill="none" stroke="{{P.trunk}}" stroke-width="4" stroke-linecap="round"></path></sc-for>
    <path d="{{topD}}" fill="none" stroke="#151B2B" stroke-width="20" stroke-linejoin="round"></path>
    <path d="{{topD}}" fill="none" stroke="{{P.grass}}" stroke-width="14" stroke-linejoin="round"></path>
    <path d="{{topD}}" transform="translate(0 -3)" fill="none" stroke="{{P.grassHi}}" stroke-width="4" stroke-linejoin="round" opacity=".9"></path>
    <sc-for list="{{rocks}}" as="r" hint-placeholder-count="5">
      <path d="M-22 4 L-16 -14 L2 -22 L18 -12 L24 4 Z" transform="{{r.tf}}" fill="{{P.rock}}" stroke="#151B2B" stroke-width="4" stroke-linejoin="round"></path>
    </sc-for>
    <sc-for list="{{trees}}" as="t" hint-placeholder-count="8">
      <g transform="{{t.tf}}" stroke="#151B2B" stroke-width="4" stroke-linejoin="round">
        <sc-if value="{{tPuffy}}" hint-placeholder-val="{{ true }}">
          <g><rect x="-6" y="-46" width="12" height="50" fill="{{P.trunk}}"></rect>
            <g><animateTransform attributeName="transform" type="rotate" values="-2 0 -40;2 0 -40;-2 0 -40" dur="{{t.dur}}" repeatCount="indefinite"></animateTransform>
              <circle cx="-14" cy="-58" r="22" fill="{{P.foliageDark}}"></circle><circle cx="14" cy="-60" r="24" fill="{{P.foliage}}"></circle><circle cx="0" cy="-82" r="24" fill="{{P.foliage}}"></circle>
              <path d="M-8 -92 Q2 -100 12 -94" fill="none" stroke="{{P.grassHi}}" stroke-width="4" stroke-linecap="round"></path>
            </g></g>
        </sc-if>
        <sc-if value="{{tDead}}" hint-placeholder-val="{{ false }}">
          <g><rect x="-6" y="-46" width="12" height="50" fill="{{P.trunk}}"></rect><path d="M0 -40 L-22 -72 M0 -50 L18 -84 M-12 -58 L-26 -60 M10 -68 L26 -70" fill="none" stroke="{{P.trunk}}" stroke-width="6" stroke-linecap="round"></path></g>
        </sc-if>
        <sc-if value="{{tPine}}" hint-placeholder-val="{{ false }}">
          <g><rect x="-6" y="-46" width="12" height="50" fill="{{P.trunk}}"></rect><path d="M0 -112 L30 -50 L-30 -50 Z" fill="{{P.foliage}}"></path><path d="M0 -112 L22 -70 L-22 -70 Z" fill="{{P.foliageDark}}"></path><path d="M0 -112 L12 -88 Q0 -82 -12 -88 Z" fill="#F2F8FF"></path></g>
        </sc-if>
        <sc-if value="{{tCactus}}" hint-placeholder-val="{{ false }}">
          <g><path d="M-9 4 V-86 Q-9 -98 0 -98 Q9 -98 9 -86 V4 Z" fill="{{P.foliage}}"></path><path d="M-9 -40 H-24 V-64 Q-24 -72 -18 -72 Q-12 -72 -12 -64 V-52 H-9 M9 -54 H22 V-76 Q22 -84 28 -84 Q34 -84 34 -76 V-46 H9" fill="{{P.foliage}}"></path><path d="M-3 -90 V-6" stroke="{{P.foliageDark}}" stroke-width="3"></path></g>
        </sc-if>
        <sc-if value="{{tShroom}}" hint-placeholder-val="{{ false }}">
          <g><circle cx="0" cy="-46" r="44" fill="{{P.glow}}" opacity=".12" stroke="none"></circle><path d="M-7 4 Q-10 -24 -5 -40 H5 Q10 -24 7 4 Z" fill="{{P.trunk}}"></path><path d="M-36 -38 Q0 -86 36 -38 Q0 -28 -36 -38 Z" fill="{{t.cap}}"></path><circle cx="-14" cy="-52" r="5" fill="#F5F1E8" stroke="none"></circle><circle cx="10" cy="-58" r="4" fill="#F5F1E8" stroke="none"></circle><circle cx="20" cy="-44" r="3.5" fill="#F5F1E8" stroke="none"></circle></g>
        </sc-if>
      </g>
    </sc-for>
    <sc-for list="{{columns}}" as="c" hint-placeholder-count="0">
      <g transform="{{c.tf}}" stroke="#151B2B" stroke-width="4" stroke-linejoin="round"><rect x="-16" y="-96" width="32" height="96" fill="#E8C99A"></rect><rect x="-24" y="-108" width="48" height="14" fill="#E8C99A"></rect><path d="M-6 -90 V-6 M6 -90 V-6" stroke="#C9A26B" stroke-width="3"></path></g>
    </sc-for>
  </g>
  </sc-if>

  <sc-if value="{{showBack}}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{motes}}" as="m" hint-placeholder-count="14">
      <circle cx="{{m.x}}" cy="{{m.y}}" r="{{m.r}}" fill="{{P.mote}}" opacity=".8">
        <animate attributeName="cy" values="{{m.vals}}" dur="{{m.dur}}" begin="{{m.begin}}" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0;.9;0" dur="{{m.dur}}" begin="{{m.begin}}" repeatCount="indefinite"></animate>
      </circle>
    </sc-for>
  </sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"map":{"editor":"enum","options":["cobalt","ember","glacier","dunes","skyreach","hollow"],"default":"cobalt"},"layer":{"editor":"enum","options":["all","back","terrain"],"default":"all"},"w":{"editor":"int","default":1440,"min":100,"max":4000},"h":{"editor":"int","default":750,"min":60,"max":2000},"craters":{"editor":null},"$preview":{"width":1440,"height":750}}'>
// Map shapes — the same block is used by Battle, BattleTablet and BattleMobile (and packages/shared/src/config/maps.ts).
const MAPS = {
  cobalt: { n: 'Cobalt Crags', W: 2400, H: 1000, base: 700, waves: [[40, 150, 1], [22, 61, 0.4], [10, 27, 0]], peaks: [[1200, 230, 200], [520, 90, 120], [1880, 100, 130]], chasms: [], thick: 0 },
  ember: { n: 'Ember Basin', W: 2800, H: 1000, base: 720, waves: [[46, 170, 0.2], [18, 53, 1.1], [9, 31, 0]], peaks: [[800, 200, 140], [2000, 210, 150], [1400, -80, 220]], chasms: [], thick: 0 },
  glacier: { n: 'Glacier Rift', W: 2600, H: 1050, base: 720, waves: [[30, 140, 2], [24, 70, 0.3], [8, 25, 1]], peaks: [[1300, 190, 320], [450, 60, 100], [2150, 70, 110]], chasms: [], thick: 0 },
  dunes: { n: 'Sunscar Dunes', W: 3000, H: 1000, base: 730, waves: [[55, 260, 0.5], [24, 90, 1.7], [6, 20, 0]], peaks: [[1500, 140, 260], [620, 70, 150], [2380, 80, 160]], chasms: [], thick: 0 },
  skyreach: { n: 'Skyreach Isles', W: 2800, H: 1100, base: 640, waves: [[35, 120, 0.8], [15, 45, 2], [6, 22, 0]], peaks: [[1400, 150, 160], [420, 60, 120], [2380, 70, 120]], chasms: [[860, 150], [1930, 160]], thick: 250 },
  hollow: { n: 'Glowcap Hollow', W: 2600, H: 1000, base: 700, waves: [[34, 130, 2.4], [20, 57, 0.2], [9, 24, 1]], peaks: [[900, 120, 140], [1700, 140, 150]], chasms: [], thick: 0 }
};
const topY = (m, x) => { let y = m.base; for (const [a, p, ph] of m.waves) y += a * Math.sin(x / p + ph); for (const [px, h, w] of m.peaks) y -= h * Math.exp(-Math.pow((x - px) / w, 2)); return y; };
const inChasm = (m, x) => m.chasms.some(([c, w]) => Math.abs(x - c) < w / 2);
const edgeDist = (m, x) => { let d = Math.min(x, m.W - x); for (const [c, w] of m.chasms) d = Math.min(d, Math.abs(Math.abs(x - c) - w / 2)); return d; };
const botY = (m, x) => { if (!m.thick) return m.H + 20; const k = Math.min(1, edgeDist(m, x) / 160); return topY(m, x) + 6 + (m.thick + 30 * Math.sin(x / 70)) * Math.sqrt(k); };

class Component extends DCLogic {
  renderVals() {
    const id = MAPS[this.props.map] ? this.props.map : 'cobalt';
    const m = MAPS[id], W = m.W, H = m.H;
    const layer = this.props.layer || 'all';
    const PAL = {
      cobalt: { skyTop: '#24407A', skyMid: '#5B8FD6', skyBot: '#F6C99A', far: '#5468A8', mid: '#3E6E86', near: '#2F5B5E', grass: '#6BCB5A', grassHi: '#B5EB78', dirt: '#8B5A3C', dirtDark: '#5E3A28', rock: '#8A93A8', foliage: '#4FB05A', foliageDark: '#2F7D45', trunk: '#6A4030', fall: '#8FE3FF', cloud: '#F5F1E8', mote: '#FFF4C2', glow: '#FFD166' },
      ember: { skyTop: '#1E1030', skyMid: '#7A2E4A', skyBot: '#FF8A4C', far: '#4A2240', mid: '#3A1A30', near: '#2A1424', grass: '#E0703A', grassHi: '#FFB45E', dirt: '#5A2E2A', dirtDark: '#3A1C1C', rock: '#7A6268', foliage: '#3A2A2E', foliageDark: '#24181C', trunk: '#2A1A1E', fall: '#FF8A3D', cloud: '#C98080', mote: '#FFB45E', glow: '#FF8A3D' },
      glacier: { skyTop: '#0B1530', skyMid: '#1F3D72', skyBot: '#6FA7D8', far: '#2C4A7E', mid: '#24406C', near: '#1C335A', grass: '#EAF4FF', grassHi: '#FFFFFF', dirt: '#5F8BB8', dirtDark: '#3E6694', rock: '#9FB4CF', foliage: '#2E6B6A', foliageDark: '#1F4E50', trunk: '#4A3A3A', fall: '#D7F3FF', cloud: '#C9D8F0', mote: '#FFFFFF', glow: '#8FE3FF' },
      dunes: { skyTop: '#3E7CC9', skyMid: '#8EC3E8', skyBot: '#FFE2B0', far: '#D99A6C', mid: '#C98A58', near: '#B8784A', grass: '#F2C27A', grassHi: '#FFE6B0', dirt: '#D9954F', dirtDark: '#A86A38', rock: '#B98A6A', foliage: '#5ACB91', foliageDark: '#2F7D45', trunk: '#8A5A2E', fall: '#8FE3FF', cloud: '#FFF4E0', mote: '#FFE6B0', glow: '#FFD166' },
      skyreach: { skyTop: '#2E6FD0', skyMid: '#7FB8F5', skyBot: '#E8F5FF', far: '#A9C8EE', mid: '#FFFFFF', near: '#F2F8FF', grass: '#7BD86A', grassHi: '#C4F28A', dirt: '#9A6B48', dirtDark: '#6B4630', rock: '#A9B3CC', foliage: '#5DC46A', foliageDark: '#2F8A4A', trunk: '#6A4030', fall: '#8FE3FF', cloud: '#FFFFFF', mote: '#FFFFFF', glow: '#FFD166' },
      hollow: { skyTop: '#0E0820', skyMid: '#2A1650', skyBot: '#5A3A86', far: '#2A1A48', mid: '#22143C', near: '#1A1030', grass: '#59D9A8', grassHi: '#A8FFD8', dirt: '#3E2C5A', dirtDark: '#2A1D40', rock: '#6E6390', foliage: '#FF7EB6', foliageDark: '#B07CF2', trunk: '#E6D9F2', fall: '#A8FFD8', cloud: '#7A5AA8', mote: '#D8FF8A', glow: '#A8FFD8' }
    };
    const P = PAL[id];
    let seed = 7 + id.length * 13;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const f1 = (v) => v.toFixed(1);

    // Terrain: one closed sub-path per landmass (split at chasms; floating islands have an underside).
    const segs = []; let a = 0;
    for (const [c, w] of m.chasms.slice().sort((p, q) => p[0] - q[0])) { segs.push([a, c - w / 2]); a = c + w / 2; }
    segs.push([a, W]);
    let terrainD = '', topD = '', botD = '';
    for (const [x0, x1] of segs) {
      const xs = []; for (let x = x0; x < x1; x += 8) xs.push(x); xs.push(x1);
      const tops = xs.map((x) => f1(x) + ' ' + f1(topY(m, x)));
      topD += 'M' + tops.join(' L') + ' ';
      if (m.thick) {
        const bots = xs.slice().reverse().map((x) => f1(x) + ' ' + f1(botY(m, x)));
        terrainD += 'M' + tops.join(' L') + ' L' + bots.join(' L') + ' Z ';
        botD += 'M' + bots.join(' L') + ' ';
      } else terrainD += 'M' + tops.join(' L') + ' L' + f1(x1) + ' ' + (H + 20) + ' L' + f1(x0) + ' ' + (H + 20) + ' Z ';
    }
    const ok = (x) => !inChasm(m, x) && edgeDist(m, x) > 70;
    const raw = this.props.craters || [];
    const craters = raw.map((c) => ({ x: c.x, y: c.y, r: c.r, rim: c.r + 9 }));

    const night = id === 'ember' || id === 'glacier' || id === 'hollow';
    const stars = Array.from({ length: night ? Math.round(W / 45) : 6 }, () => ({ x: Math.round(rnd() * W), y: Math.round(rnd() * H * 0.36), r: f1(0.8 + rnd() * 1.6), dur: f1(2 + rnd() * 3) + 's' }));
    const nC = 4 + Math.round(W / 600) + (id === 'skyreach' ? 5 : 0);
    const clouds = Array.from({ length: nC }, (_, i) => {
      const y = 60 + (i % 5) * 70 + rnd() * 40, sc = 1 + rnd() * 1.6, dur = 110 + rnd() * 90;
      return { vals: '-360 ' + y.toFixed(0) + ';' + (W + 360) + ' ' + y.toFixed(0), dur: dur.toFixed(0) + 's', begin: '-' + (dur * (i / nC)).toFixed(0) + 's', tf: 'scale(' + sc.toFixed(2) + ')', op: id === 'skyreach' ? 0.95 : id === 'cobalt' || id === 'dunes' ? 0.85 : 0.35 };
    });
    const path = (fn, step) => { let d = 'M0 ' + H; for (let x = 0; x <= W + step; x += step) d += ' L' + x + ' ' + f1(fn(x)); return d + ' L' + (W + step) + ' ' + H + ' Z'; };
    let farD;
    if (id === 'dunes') farD = path((x) => H * 0.5 - 80 * (Math.sin(x / 310) > 0.25 ? 1 : 0) - 46 * (Math.sin(x / 140 + 1) > 0.55 ? 1 : 0), 30);
    else if (id === 'skyreach') farD = '';
    else { let i = 0; farD = path((x) => H * 0.44 + 50 * Math.sin(x / 210 + id.length) + 36 * Math.sin(x / 77) + ((i++ % 2) ? -28 : 22), 90); }
    const midD = id === 'skyreach' ? path((x) => H * 0.8 - Math.abs(Math.sin(x / 90)) * 40, 15) : path((x) => H * 0.56 + 36 * Math.sin(x / 260 + 1) + 18 * Math.sin(x / 90), 20);
    const nearD = id === 'skyreach' ? path((x) => H * 0.88 - Math.abs(Math.sin(x / 70 + 1)) * 34, 15) : path((x) => H * 0.64 + 30 * Math.sin(x / 200 + 2) + 14 * Math.sin(x / 70), 20);
    const ISL = { cobalt: [[0.14, 0.24, 1], [0.5, 0.14, 0.7], [0.84, 0.26, 1.15]], ember: [[0.32, 0.22, 1], [0.6, 0.15, 0.7], [0.88, 0.25, 1]], glacier: [[0.2, 0.22, 1], [0.55, 0.13, 0.75], [0.85, 0.24, 1.1]], dunes: [], skyreach: [[0.08, 0.18, 0.8], [0.27, 0.1, 0.6], [0.44, 0.24, 1], [0.6, 0.12, 0.7], [0.76, 0.22, 0.9], [0.93, 0.1, 0.6]], hollow: [[0.3, 0.2, 0.8], [0.52, 0.12, 0.9]] };
    const islands = ISL[id].map(([fx, fy, s], i) => ({ tf: 'translate(' + Math.round(W * fx) + ' ' + Math.round(H * fy) + ') scale(' + s + ')', dur: (5 + i * 0.8).toFixed(1) + 's' }));
    const CEL = { cobalt: [0.8, 0.17], ember: [0.68, 0.42], glacier: [0.8, 0.14], dunes: [0.6, 0.3], skyreach: [0.18, 0.14], hollow: [0.72, 0.16] };
    const aur = (k) => { const pts = (o) => 'M-40 ' + (H * 0.15 + o) + ' Q' + W * 0.25 + ' ' + (H * 0.06 - o) + ' ' + W * 0.5 + ' ' + (H * 0.14 + o) + ' T' + (W + 40) + ' ' + (H * 0.11 - o); return [pts(0), pts(k)]; };
    const [a1, a1b] = aur(30), [a2, a2b] = aur(-40);
    const treeStep = id === 'dunes' ? 330 : id === 'hollow' ? 150 : 200;
    const trees = [], columns = [];
    for (let x = 70 + rnd() * 60; x < W - 60; x += treeStep * (0.7 + rnd() * 0.7)) {
      if (!ok(x)) continue;
      if (id === 'dunes' && rnd() < 0.3) { columns.push({ tf: 'translate(' + Math.round(x) + ' ' + f1(topY(m, x) + 6) + ') scale(' + (0.6 + rnd() * 0.5).toFixed(2) + ')' }); continue; }
      trees.push({ tf: 'translate(' + Math.round(x) + ' ' + f1(topY(m, x) + 4) + ') scale(' + (0.65 + rnd() * 0.45).toFixed(2) + ')', dur: (3 + rnd() * 2).toFixed(1) + 's', cap: rnd() < 0.5 ? P.foliage : P.foliageDark });
    }
    const rocks = [];
    for (let i = 0; i < Math.round(W / 320); i++) { const x = 60 + rnd() * (W - 120); if (ok(x)) rocks.push({ tf: 'translate(' + Math.round(x) + ' ' + f1(topY(m, x) + 6) + ') scale(' + (0.7 + rnd() * 0.7).toFixed(2) + ')' }); }
    const pebbles = [];
    for (let i = 0; i < Math.round(W / 50); i++) { const x = rnd() * W; if (inChasm(m, x)) continue; const depth = m.thick ? (botY(m, x) - topY(m, x)) * 0.8 : 300; pebbles.push({ x: x.toFixed(0), y: (topY(m, x) + 30 + rnd() * Math.max(10, depth - 30)).toFixed(0), r: f1(4 + rnd() * 8), ry: f1(3 + rnd() * 5) }); }
    const roots = [];
    if (m.thick) for (let x = 40; x < W; x += 70 + rnd() * 60) { if (!ok(x)) continue; const b = botY(m, x); roots.push({ d: 'M' + f1(x) + ' ' + f1(b - 6) + ' Q' + f1(x + 8) + ' ' + f1(b + 20) + ' ' + f1(x - 2) + ' ' + f1(b + 30 + rnd() * 30) }); }
    const motesN = id === 'hollow' ? 40 : id === 'skyreach' ? 10 : 22;
    const down = id === 'glacier';
    const motes = Array.from({ length: motesN }, () => {
      const x = rnd() * W, y0 = H * 0.25 + rnd() * H * 0.5, d = 5 + rnd() * 6, amp = id === 'hollow' ? 60 : 300;
      return { x: x.toFixed(0), y: y0.toFixed(0), r: f1(1.5 + rnd() * 2.5), vals: down ? (y0 - amp).toFixed(0) + ';' + (y0 + amp * 0.6).toFixed(0) : y0.toFixed(0) + ';' + (y0 - amp).toFixed(0), dur: d.toFixed(1) + 's', begin: '-' + (rnd() * d).toFixed(1) + 's' };
    });
    const hzY = H - 46;
    let hzWave = 'M0 ' + hzY; for (let x = 0; x <= W + 60; x += 30) hzWave += ' Q' + (x + 15) + ' ' + (hzY + (x / 30 % 2 ? 6 : -6)) + ' ' + (x + 30) + ' ' + hzY;
    const NAMES = Object.fromEntries(Object.entries(MAPS).map(([k, v]) => [k, v.n]));
    return {
      map: id, P, W, H, vb: '0 0 ' + W + ' ' + H, maskW: W + 100, maskH: H + 100, label: NAMES[id] + ' battlefield',
      w: Number(this.props.w ?? 1440), h: Number(this.props.h ?? 750),
      showBack: layer !== 'terrain', showTerrain: layer !== 'back', rootBg: layer === 'terrain' ? 'transparent' : P.skyTop,
      terrainD, topD, botD, isFloat: !!m.thick, roots, craters, stars, clouds, islands, trees, columns, rocks, pebbles, motes,
      farD, midD, nearD, midOp: id === 'skyreach' ? 0.75 : 1, nearOp: id === 'skyreach' ? 0.9 : 1,
      hazeY: Math.round(H * 0.46), hazeH: Math.round(H * 0.3),
      celT: 'translate(' + Math.round(W * CEL[id][0]) + ' ' + Math.round(H * CEL[id][1]) + ')',
      aur1: a1 + ';' + a1b + ';' + a1, aur1a: a1, aur2: a2 + ';' + a2b + ';' + a2, aur2a: a2,
      volcanoes: [0.12, 0.46].map((fx, i) => ({ tf: 'translate(' + Math.round(W * fx) + ' ' + Math.round(H * 0.34) + ') scale(' + (i ? 2.1 : 2.6) + ')' })),
      pyramids: [0.26, 0.31].map((fx, i) => ({ tf: 'translate(' + Math.round(W * fx) + ' ' + Math.round(H * 0.5) + ') scale(' + (i ? 0.7 : 1) + ')' })),
      skyIsles: id === 'skyreach' ? Array.from({ length: 7 }, (_, i) => ({ tf: 'translate(' + Math.round(W * (0.06 + i * 0.145)) + ' ' + Math.round(H * (0.42 + (i % 3) * 0.06)) + ') scale(' + (0.6 + (i % 2) * 0.5) + ')' })) : [],
      bgShrooms: id === 'hollow' ? Array.from({ length: Math.round(W / 420) }, (_, i) => ({ tf: 'translate(' + Math.round(140 + i * 420 + rnd() * 120) + ' ' + Math.round(H * 0.72) + ') scale(' + (0.7 + rnd() * 0.6).toFixed(2) + ')', dur: (2 + rnd() * 2).toFixed(1) + 's' })) : [],
      isLava: id === 'ember', isWater: id === 'glacier', hzY, hzWave,
      isCobalt: id === 'cobalt', isEmber: id === 'ember', isGlacier: id === 'glacier', isDunes: id === 'dunes', isSky: id === 'skyreach', isHollow: id === 'hollow',
      tPuffy: id === 'cobalt' || id === 'skyreach', tDead: id === 'ember', tPine: id === 'glacier', tCactus: id === 'dunes', tShroom: id === 'hollow'
    };
  }
}
